name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format --check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
        env:
          TURSO_DATABASE_URL: libsql://ci-placeholder.turso.io
          TURSO_AUTH_TOKEN: ci
